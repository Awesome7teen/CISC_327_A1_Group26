name: Python Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: equipment-rental-management

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests with coverage
        run: python -m pytest -v --cov=app --cov-report=term-missing --cov-fail-under=90


